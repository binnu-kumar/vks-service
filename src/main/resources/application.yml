spring:
  application:
    name: vks-service
  config:
    import:
      - "optional:configserver:"
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8080}
      fail-fast: true
      retry:
        max-attempts: 5
        initial-interval: 1000
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

spring.main.lazy-initialization: false

logging:
  config: classpath:logback-spring.xml
